[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
name = "dqmtools"
description = "Tools for on-the-spot Data Quality Monitoring"
version = "0.5.1"
readme = "docs/README.md"
urls = { Homepage = "https://github.com/DUNE-DAQ/dqmtools" }
requires-python = ">=3.6"
dependencies = [
	     "numpy",
	     "pandas",
	     "tables",
	     "tabulate",
	     "plotly",
	     "tqdm",
	     "kaleido",
	     ]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*"]

[tool.pytest.ini_options]
addopts = "-v --tb=short --cov=runconftools --cov=src/runconftools tests/"  # omitted --cov-report=html to avoid suppressing table to stdout

[tool.coverage.run]
source = ["dqmtools"]
omit = ["tests/*", "scripts/*"]

# * See https://docs.astral.sh/ruff/rules/ for details on Ruff's linting options
[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # check for errors using PyFlakes
    "I",    # best practices for import calls
    "UP",   # suggestions for code modernization
    "RUF",  # built-in Ruff warnings
    "R",    # refactoring suggestions
]
ignore = [
    "E501", # Don't enforce line lengths within a linting context
]
