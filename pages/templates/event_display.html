{% extends "base.html" %}

{% block content %}

<div class="grid-container">

  <div class="row">
    <div class="col-md-12">

      {% if plane %}
      <h1>NP04 EVENT DISPLAYS: APA {{ apa }} Plane {{ plane }}</h1>
      {% elif apa %}
      <h1>NP04 EVENT DISPLAYS: APA {{ apa }}</h1>
      {% else %}
      <h1>NP04 EVENT DISPLAYS</h1>
      {% endif %}

    </div>
  </div>

    {% for image in images %}
    <div class="row">
      <div class="image-container">
        <img src="{{ url_for('serve_image', subdir='EventDisplays', filename=image) }}" alt="{{ image }}"/>
      </div>
    </div>
    {% endfor %}

</div>

{% endblock %}
